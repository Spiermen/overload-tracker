<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Overload">
<meta name="description" content="Progressive overload tracker: log lifts, beat last session, track PRs. Works offline.">
<title>Overload - Progressive Overload Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#0d0f13;--card:#161920;--card2:#1f232c;--line:#2a2f3a;--text:#eef1f6;--mut:#8f97a8;--acc:#ff7a1a;--acc2:#4cc2ff;--good:#3ddc84;--bad:#ff5d5d;--gold:#ffc94a;--r:16px;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom));min-height:100vh;overscroll-behavior-y:none}
body.timer-on{padding-bottom:calc(158px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top)) 14px 8px 16px;background:rgba(13,15,19,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header h1{font-size:21px;margin:0;font-weight:800;letter-spacing:.2px}
header h1 .logo{color:var(--acc)}
main{padding:12px 12px 20px;max-width:560px;margin:0 auto}
h2{font-size:18px;margin:0}
.h2{font-size:22px;font-weight:800}
.h3{font-size:17px;font-weight:750}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.inner{background:var(--card2);border-color:#2c313c}
button{font:inherit;color:inherit;border:0;background:var(--card2);border-radius:12px;min-height:44px;padding:0 14px;cursor:pointer;touch-action:manipulation;font-weight:600}
button:active{transform:scale(.97);filter:brightness(1.15)}
button:disabled{opacity:.35}
.btn-primary{background:var(--acc);color:#140a00;font-weight:800}
.btn-block{display:block;width:100%;min-height:54px;font-size:17px}
.btn-ghost{background:transparent;border:1px solid var(--line)}
.btn-danger{background:transparent;border:1px solid #5b2a2d;color:var(--bad)}
.sm{min-height:36px;padding:0 12px;font-size:14px}
.icon-btn{min-width:44px;padding:0;display:inline-grid;place-items:center;background:transparent;font-size:20px}
.icon-btn svg{width:24px;height:24px}
input,select{font:inherit;font-size:17px;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:12px;min-height:46px;padding:0 12px;width:100%;-webkit-appearance:none;appearance:none}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px}
input::placeholder{color:#5c6475}
label{display:block;font-size:13px;color:var(--mut);font-weight:600}
label input,label select{margin-top:5px;color:var(--text)}
.tog{display:flex;align-items:center;gap:12px;font-size:16px;color:var(--text);min-height:48px;font-weight:500}
.tog input{width:24px;height:24px;min-height:0;accent-color:var(--acc);-webkit-appearance:auto;appearance:auto;margin:0}
.mut{color:var(--mut)}.small{font-size:13px}.center{text-align:center}.right{text-align:right}
.row{display:flex;align-items:center}.gap{gap:8px}.grow{flex:1}.between{justify-content:space-between}
.mt{margin-top:10px}.mb{margin-bottom:10px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:700;margin-bottom:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;background:transparent;min-height:42px}
.seg button.on{background:var(--acc);color:#140a00;font-weight:800}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:18px 4px 10px}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(17,19,24,.97);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom))}
#tabs button{background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:60px;font-size:11px;font-weight:700;color:var(--mut);border-radius:14px}
#tabs svg{width:26px;height:26px}
#tabs button.on{color:var(--acc)}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hero p{margin:6px 0 14px}
.tpl{display:flex;gap:12px;align-items:center}
.tpl .col{display:flex;flex-direction:column;gap:6px;min-width:84px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.stat b{display:block;font-size:19px;margin-top:2px}
.prline{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.prline:first-of-type{border-top:0}
.wk-head input.wk-name{font-size:20px;font-weight:800;background:transparent;border-color:transparent;padding:0 2px;min-height:40px}
.wk-head input.wk-name:focus{background:var(--card2)}
.ex-h{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:-4px -4px 0 -4px}
.ex-title{background:transparent;font-size:18px;font-weight:800;padding:0 4px;text-align:left;flex:1;min-width:0}
.ex-title .chev{color:var(--mut)}
.ex-sub{margin:0 0 10px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.cmp>div{background:var(--card2);border-radius:12px;padding:9px 10px;font-size:14px;min-width:0}
.cmp .small{margin-top:3px}
.up{color:var(--good);font-weight:700}.down{color:var(--bad);font-weight:700}.same{color:var(--mut)}
.sug{display:flex;align-items:center;gap:10px;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:10px;background:#1d1a14;border:1px solid #3a3020}
.sug>div{flex:1}
.sug.up{background:#14221a;border-color:#245236;color:var(--text);font-weight:500}
.sug.down{background:#261617;border-color:#5b2a2d;color:var(--text);font-weight:500}
.sug.same{color:var(--text)}
.sug.new{background:var(--card2);border-color:var(--line)}
.sug b{color:var(--gold)}
.sets-h,.set{display:grid;grid-template-columns:30px 1fr 1fr 60px 52px;gap:6px;align-items:center}
.sets-h{font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;text-align:center;padding:0 0 2px}
.set{margin-top:6px}
.set input{text-align:center;font-size:20px;font-weight:800;min-height:50px;padding:0 4px}
.set select{min-height:50px;padding:0 2px;text-align:center;text-align-last:center;font-size:15px;font-weight:700;color:var(--mut)}
.set select.has{color:var(--text)}
.setno{min-height:50px;padding:0;background:transparent;color:var(--mut);font-weight:800;font-size:16px}
.chk{min-height:50px;padding:0;display:grid;place-items:center;background:var(--card2);border:1px solid var(--line);color:var(--mut)}
.chk svg{width:26px;height:26px}
.set.done .chk{background:var(--good);border-color:var(--good);color:#04210f}
.set.done input,.set.done select{background:#13241a;border-color:#22533a}
.set.pr input,.set.pr select{border-color:var(--gold);background:#2a2412}
.set.pr .chk{background:var(--gold);border-color:var(--gold);color:#241a00}
.set.pr{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
.badges{padding-left:36px}
.badges:empty{display:none}
.b{display:inline-block;font-size:12px;font-weight:800;color:#241a00;background:var(--gold);border-radius:999px;padding:3px 9px;margin:5px 4px 0 0;white-space:nowrap}
.vol-pr{margin-top:8px;text-align:center}
.card.ex{padding:14px 12px}
.card.ex.has-pr{border-color:#6b5520;box-shadow:0 0 0 1px #6b552044,0 0 24px #ffc94a14}
#sheetWrap{position:fixed;inset:0;z-index:50}
#sheetWrap .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;transition:opacity .2s}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#12151b;border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:6px 14px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .22s ease;max-width:600px;margin:0 auto}
#sheet.tall{max-height:94vh}
#sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:#3a404c;margin:4px auto 6px}
#sheetWrap.open .backdrop{opacity:1}
#sheetWrap.open #sheet{transform:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;position:sticky;top:-6px;background:#12151b;z-index:2;padding:4px 0}
.sheet-h h2{font-size:20px}
.pick{display:flex;width:100%;justify-content:space-between;align-items:center;text-align:left;background:transparent;border-bottom:1px solid var(--line);border-radius:0;min-height:54px;padding:0 4px;font-weight:600}
.pick .small{font-weight:500}
.menu{display:flex;flex-direction:column;gap:8px}
.menu button{min-height:52px;text-align:left}
.tpl-row{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line);min-height:52px}
.prgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tile{background:var(--card2);border-radius:14px;padding:10px 12px}
.tile b{display:block;font-size:20px;margin:2px 0}
.rec,.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.rec span:first-child{min-width:80px;font-weight:700}
.hrow .small{margin-top:2px}
.chart{width:100%;height:auto;display:block;margin-top:6px}
.chart .gl{stroke:#2b303b;stroke-width:1}
.chart .ax{fill:#8f97a8;font-size:11px;font-family:inherit}
.chart polyline{fill:none;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.chart polyline.e{stroke:var(--acc)}.chart polyline.t{stroke:var(--acc2)}
.chart circle.e{fill:var(--acc)}.chart circle.t{fill:var(--acc2)}
.chart-empty{padding:28px 10px;text-align:center;color:var(--mut);font-size:14px}
.legend{display:flex;gap:12px;font-size:12px;font-weight:700}
.lg::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.lg.e::before{background:var(--acc)}.lg.t::before{background:var(--acc2)}
b.e{color:var(--acc)}
.exrow{display:flex;width:100%;align-items:center;gap:10px;text-align:left;padding:12px 14px;min-height:64px;margin-bottom:8px}
.spark{flex:none}
.spark polyline{fill:none;stroke:var(--acc);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
details.hist summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;min-height:44px}
details.hist summary::-webkit-details-marker{display:none}
details.hist[open] summary{margin-bottom:6px}
.hist-ex{padding:8px 0;border-top:1px solid var(--line)}
.hx-name{font-weight:700}
.empty{text-align:center;padding:28px 18px}
#timerbar{position:fixed;left:10px;right:10px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:25;display:flex;align-items:center;gap:8px;background:#1c2029;border:1px solid #343a47;border-radius:18px;padding:8px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:560px;margin:0 auto}
#timerbar[hidden]{display:none}
#tprog{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ff7a1a33,#ff7a1a14);z-index:0;transition:width .25s linear}
#timerbar>:not(#tprog){position:relative;z-index:1}
#timerbar button{min-height:48px;min-width:56px;background:#2a2f3a}
.tmid{flex:1;text-align:center}
#tleft{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.presets button{min-height:60px;font-size:18px}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translate(-50%,-20px);opacity:0;z-index:60;background:#232833;border:1px solid #3a4150;color:var(--text);padding:12px 18px;border-radius:14px;font-weight:700;pointer-events:none;transition:all .25s;max-width:92vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.gold{background:var(--gold);color:#241a00;border-color:var(--gold)}
#toast.acc{background:var(--acc);color:#140a00;border-color:var(--acc)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1 id="title">Train</h1>
  <button class="icon-btn" data-action="timerMenu" aria-label="Rest timer"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2.5h5"/></svg></button>
</header>
<main id="view"></main>

<div id="timerbar" hidden>
  <div id="tprog"></div>
  <button data-action="tAdj" data-d="-15" aria-label="Minus 15 seconds">-15</button>
  <div class="tmid"><div class="lbl">Rest</div><div id="tleft">0:00</div></div>
  <button data-action="tAdj" data-d="15" aria-label="Plus 15 seconds">+15</button>
  <button data-action="tSkip">Skip</button>
</div>

<nav id="tabs">
  <button data-action="tab" data-tab="train"><svg class="i" viewBox="0 0 24 24"><path d="M6.5 6.5v11M3.5 9v6M17.5 6.5v11M20.5 9v6M6.5 12h11"/></svg>Train</button>
  <button data-action="tab" data-tab="history"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>History</button>
  <button data-action="tab" data-tab="progress"><svg class="i" viewBox="0 0 24 24"><path d="M3.5 20h17M5 16l5-5 4 3 6-7"/><path d="M16 7h4v4"/></svg>Progress</button>
  <button data-action="tab" data-tab="settings"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>Settings</button>
</nav>

<div id="sheetWrap" hidden><div class="backdrop" data-action="closeSheet"></div><div id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
'use strict';
/* ---------- basics ---------- */
const KEY = 'overload.v1', TKEY = 'overload.timer', LB_PER_KG = 2.20462;
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r2 = (x, d) => { const m = 10 ** d; return Math.round(x * m) / m; };
const CHECK = '<svg class="i" viewBox="0 0 24 24" style="stroke-width:3"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

const SEED_EX = [
  ['Bench Press', 'upper', 5, 8], ['Overhead Press', 'upper', 6, 10], ['Incline Dumbbell Press', 'upper', 8, 12],
  ['Lateral Raise', 'upper', 12, 15], ['Triceps Pushdown', 'upper', 10, 15], ['Barbell Row', 'upper', 6, 10],
  ['Pull-up', 'upper', 6, 10], ['Lat Pulldown', 'upper', 8, 12], ['Seated Cable Row', 'upper', 8, 12],
  ['Face Pull', 'upper', 12, 15], ['Biceps Curl', 'upper', 8, 12], ['Back Squat', 'lower', 5, 8],
  ['Deadlift', 'lower', 3, 5], ['Romanian Deadlift', 'lower', 6, 10], ['Leg Press', 'lower', 10, 15],
  ['Walking Lunge', 'lower', 8, 12], ['Leg Curl', 'lower', 10, 15], ['Leg Extension', 'lower', 10, 15],
  ['Hip Thrust', 'lower', 8, 12], ['Standing Calf Raise', 'lower', 10, 15]
];
function freshState() {
  const exercises = SEED_EX.map(([name, type, repMin, repMax]) => ({ id: uid(), name, type, repMin, repMax, inc: null }));
  const id = n => exercises.find(e => e.name === n).id;
  const tpl = (name, list) => ({ id: uid(), name, exIds: list.map(id) });
  return {
    version: 1,
    settings: { unit: 'lb', inc: { lb: { upper: 5, lower: 10 }, kg: { upper: 2.5, lower: 5 } }, repMin: 8, repMax: 12, rest: 120, autoRest: true, wakeLock: true, lastBackup: null },
    exercises,
    templates: [
      tpl('Push', ['Bench Press', 'Overhead Press', 'Incline Dumbbell Press', 'Lateral Raise', 'Triceps Pushdown']),
      tpl('Pull', ['Barbell Row', 'Pull-up', 'Lat Pulldown', 'Face Pull', 'Biceps Curl']),
      tpl('Legs', ['Back Squat', 'Romanian Deadlift', 'Leg Press', 'Leg Curl', 'Standing Calf Raise'])
    ],
    workouts: [], active: null
  };
}
function migrate(s) {
  const d = freshState();
  s.settings = { ...d.settings, ...(s.settings || {}) };
  s.settings.inc = { ...d.settings.inc, ...(s.settings.inc || {}) };
  s.exercises = Array.isArray(s.exercises) ? s.exercises : [];
  s.templates = Array.isArray(s.templates) ? s.templates : [];
  s.workouts = (Array.isArray(s.workouts) ? s.workouts : []).filter(w => w && Array.isArray(w.entries)).sort((a, b) => a.start - b.start);
  s.active = s.active && Array.isArray(s.active.entries) ? s.active : null;
  s.version = 1;
  return s;
}
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.exercises) && Array.isArray(s.workouts)) return migrate(s); } catch (e) { }
  return freshState();
}
let S = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('Could not save - storage full? Export a backup.'); }
}
save();

/* ---------- units & math ---------- */
const U = () => S.settings.unit;
const toD = lb => U() === 'kg' ? lb / LB_PER_KG : lb;
const fromD = v => U() === 'kg' ? v * LB_PER_KG : v;
const fw = lb => lb == null ? '' : String(r2(toD(lb), U() === 'kg' ? 2 : 1));
const fe1 = lb => Math.round(toD(lb));
const fvol = lb => Math.round(toD(lb)).toLocaleString();
const e1 = (w, r) => r > 1 ? w * (1 + r / 30) : w;             // Epley
const vol = sets => sets.reduce((a, s) => a + (s.w || 0) * (s.r || 0), 0);
const isDone = s => s.done && s.r > 0;
const exOf = id => S.exercises.find(e => e.id === id);
const exName = id => (exOf(id) || { name: '(deleted exercise)' }).name;
const repRange = ex => [ex.repMin || S.settings.repMin, ex.repMax || S.settings.repMax];
const incD = ex => ex.inc != null ? r2(toD(ex.inc), 2) : S.settings.inc[U()][ex.type || 'upper'];
function sessStats(sets) {
  let top = 0, topR = 0, best = 0;
  for (const s of sets) { if (s.w > top || (s.w === top && s.r > topR)) { top = s.w; topR = s.r; } best = Math.max(best, e1(s.w, s.r)); }
  return { top, topR, e1: best, vol: vol(sets), n: sets.length };
}
function sessionsFor(exId) {
  const out = [];
  for (const w of S.workouts) for (const en of w.entries) if (en.exId === exId && en.sets.length) out.push({ wid: w.id, date: w.start, sets: en.sets });
  return out;
}
function lastDates() { const m = {}; for (const w of S.workouts) for (const en of w.entries) m[en.exId] = Math.max(m[en.exId] || 0, w.start); return m; }
function sortedExercises() { const m = lastDates(); return [...S.exercises].sort((a, b) => (m[b.id] || 0) - (m[a.id] || 0) || a.name.localeCompare(b.name)); }
function fdate(ts, long) { return new Date(ts).toLocaleDateString(undefined, long ? { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' } : { month: 'short', day: 'numeric' }); }
function fdur(ms) { const m = Math.max(1, Math.round(ms / 60000)); return m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`; }
function mmss(sec) { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }
function fmtSets(sets) {
  const g = [];
  for (const s of sets) { const l = g[g.length - 1]; if (l && Math.abs(l.w - s.w) < 0.01) l.r.push(s.r); else g.push({ w: s.w, r: [s.r] }); }

/* ---------- PRs & suggestions ---------- */
function entryPRs(en) {
  const hist = sessionsFor(en.exId);
  const prior = hist.flatMap(s => s.sets);
  let bw = prior.reduce((m, s) => Math.max(m, s.w), 0), be = prior.reduce((m, s) => Math.max(m, e1(s.w, s.r)), 0);
  const bv = hist.reduce((m, s) => Math.max(m, vol(s.sets)), 0);
  const per = [];
  for (const s of en.sets) {
    const t = [];
    if (hist.length && isDone(s)) {
      const w = s.w || 0;
      if (w > bw + 1e-6) t.push('Weight PR');
      else {
        const heavier = prior.filter(p => p.w >= w - 1e-6);
        if (heavier.length && s.r > Math.max(...heavier.map(p => p.r))) t.push('Rep PR');
      }
      if (e1(w, s.r) > be + 0.05) t.push('e1RM PR');
    }
    per.push(t);
    if (isDone(s)) { prior.push(s); bw = Math.max(bw, s.w || 0); be = Math.max(be, e1(s.w || 0, s.r)); }
  }
  const dv = vol(en.sets.filter(isDone));
  return { per, volPR: hist.length > 0 && dv > bv + 1e-6, vol: dv };
}
function suggest(ex) {
  const [mn, mx] = repRange(ex), inc = incD(ex), u = U();
  const hist = sessionsFor(ex.id);
  if (!hist.length) return { kind: 'new', text: `First session: pick a weight you can do for ${mn}-${mx} reps with 1-2 reps left in the tank.`, w: null, r: null };
  const working = sets => { const top = Math.max(...sets.map(s => s.w)); return { top, sets: sets.filter(s => s.w >= top * 0.9 - 1e-6) }; };
  const last = working(hist[hist.length - 1].sets);
  const reps = last.sets.map(s => s.r), minR = Math.min(...reps), topD = r2(toD(last.top), 2);
  const rpes = last.sets.map(s => s.rpe).filter(v => v != null);
  const avgRpe = rpes.length ? rpes.reduce((a, b) => a + b, 0) / rpes.length : null;
  if (last.top <= 0) {
    if (minR >= mx) return { kind: 'up', text: `All sets hit ${mx}+ reps at bodyweight. Add load (<b>+${inc} ${u}</b>) or slow the tempo.`, w: inc, r: mn };
    const t = Math.min(mx, minR + 1);
    return { kind: 'same', text: `Beat last time: aim for <b>${t}+ reps</b> on every set (last: ${reps.join('/')}).`, w: 0, r: t };
  }
  if (minR >= mx) {
    const easy = avgRpe != null && avgRpe <= 7, nw = r2(topD + inc * (easy ? 2 : 1), 2);
    return { kind: 'up', text: `Hit ${mx} reps on all working sets. Add weight: <b>${nw} ${u} &times; ${mn}+</b>${easy ? ' (felt easy, so a double jump)' : ''}.`, w: nw, r: mn };
  }
  if (minR < mn) {
    const prev = hist[hist.length - 2];
    if (prev) {
      const p = working(prev.sets);
      if (Math.abs(p.top - last.top) < 0.01 && Math.min(...p.sets.map(s => s.r)) < mn) {
        const step = u === 'kg' ? 2.5 : 5, nw = Math.max(step, Math.round(topD * 0.9 / step) * step);
        return { kind: 'down', text: `Missed ${mn} reps two sessions in a row at ${topD} ${u}. Deload ~10% to <b>${nw} ${u}</b> and build back up.`, w: nw, r: Math.min(mx, mn + 2) };
      }
    }
    return { kind: 'same', text: `Stay at <b>${topD} ${u}</b> and get at least ${mn} reps on every set (last: ${reps.join('/')}).`, w: topD, r: mn };
  }
  const t = Math.min(mx, minR + 1);
  return { kind: 'same', text: `Stay at <b>${topD} ${u}</b> and add reps: aim for <b>${t}+</b> per set (last: ${reps.join('/')}). Hit ${mx} on every set to move up.`, w: topD, r: t };
}

/* ---------- rest timer ---------- */
let T = null; try { T = JSON.parse(localStorage.getItem(TKEY) || 'null'); } catch (e) { }
let AC = null;
function unlockAudio() { try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) { } }
function beep() {
  if (!AC) return;
  try {
    const t0 = AC.currentTime;
    [0, 0.3, 0.6].forEach(dt => { const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = 880; o.connect(g); g.connect(AC.destination); g.gain.setValueAtTime(0.0001, t0 + dt); g.gain.exponentialRampToValueAtTime(0.4, t0 + dt + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + 0.22); o.start(t0 + dt); o.stop(t0 + dt + 0.25); });
  } catch (e) { }
}
function startTimer(sec) { T = { end: Date.now() + sec * 1000, total: sec }; localStorage.setItem(TKEY, JSON.stringify(T)); tick(); }
function stopTimer() { T = null; localStorage.removeItem(TKEY); tick(); }
function tick() {
  const bar = $('#timerbar');
  if (!T) { bar.hidden = true; document.body.classList.remove('timer-on'); return; }
  const left = (T.end - Date.now()) / 1000;
  if (left <= 0) { stopTimer(); buzz([400, 150, 400, 150, 600]); beep(); toast('Rest is over. Next set!', 'acc'); return; }
  bar.hidden = false; document.body.classList.add('timer-on');
  $('#tleft').textContent = mmss(Math.ceil(left));
  $('#tprog').style.width = Math.min(100, 100 * left / T.total) + '%';
}
setInterval(() => { tick(); const el = $('#elapsed'); if (el && S.active) el.textContent = mmss((Date.now() - S.active.start) / 1000); }, 250);

/* ---------- wake lock ---------- */
let wl = null;
async function syncWake() {
  try {
    const want = !!(S.active && S.settings.wakeLock && document.visibilityState === 'visible' && 'wakeLock' in navigator);
    if (want && !wl) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => wl = null); }
    else if (!want && wl) { await wl.release(); wl = null; }
  } catch (e) { wl = null; }
}
document.addEventListener('visibilitychange', () => { syncWake(); tick(); });

/* ---------- export / import ---------- */

function markBackup() { S.settings.lastBackup = Date.now(); save(); if (tab === 'settings') render(); toast('Backup exported'); }
function download(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);

$('#importFile').addEventListener('change', async e => {

    if (!confirm(`Replace everything on this phone with this backup?\n\n${d.workouts.length} workouts, ${d.exercises.length} exercises${d.exportedAt ? '\nExported ' + new Date(d.exportedAt).toLocaleString() : ''}`)) return;
    delete d.app; delete d.exportedAt;

function onField(e) {
  const t = e.target, f = t.dataset.field, sf = t.dataset.set;
  if (sf) { if (e.type === 'change') onSetting(t, sf); return; }
  if (!f || !S.active) return;
  if (f === 'wkname') { S.active.name = t.value; save(); return; }
  const row = t.closest('.set'); if (!row) return;
  const i = +row.dataset.i, j = +row.dataset.j, s = S.active.entries[i].sets[j];
  if (f === 'w') { const v = parseFloat(t.value.replace(',', '.')); s.w = isNaN(v) ? null : fromD(Math.max(0, v)); }
  if (f === 'r') { const v = parseInt(t.value, 10); s.r = isNaN(v) ? null : Math.max(0, v); }
  if (f === 'rpe') { s.rpe = t.value === '' ? null : +t.value; t.classList.toggle('has', s.rpe != null); }
  if (s.done && !(s.r > 0)) s.done = false;
  save(); decorate(i);
}
function onSetting(t, sf) {
  const st = S.settings, u = U(), num = parseFloat(String(t.value).replace(',', '.'));
  if (sf === 'autoRest' || sf === 'wakeLock') { st[sf] = t.checked; syncWake(); }
  else if (!(num > 0)) { toast('Enter a number above 0'); render(); return; }
  else if (sf === 'incUpper') st.inc[u].upper = num;
  else if (sf === 'incLower') st.inc[u].lower = num;
  else if (sf === 'repMin' || sf === 'repMax') { st[sf] = Math.round(num); if (st.repMin > st.repMax) [st.repMin, st.repMax] = [st.repMax, st.repMin]; }
  else if (sf === 'rest') st.rest = Math.round(num);
  save(); toast('Saved');
}
$('#sheet').addEventListener('change', e => {
  const t = e.target, f = t.dataset.exfield; if (!f || !sheetCtx || sheetCtx.type !== 'ex') return;
  const ex = exOf(sheetCtx.id); if (!ex) return;
  if (f === 'name') { const v = t.value.trim(); if (v) ex.name = v; $('#sheet .sheet-h h2').textContent = ex.name; }
  else if (f === 'repMin' || f === 'repMax') { const v = parseInt(t.value, 10); if (v > 0) ex[f] = v; if (ex.repMin && ex.repMax && ex.repMin > ex.repMax) [ex.repMin, ex.repMax] = [ex.repMax, ex.repMin]; }
  else if (f === 'inc') { const v = parseFloat(String(t.value).replace(',', '.')); ex.inc = v > 0 ? fromD(v) : null; }
  save();
  const sg = suggest(ex), box = $('#exSug'); if (box) { box.className = 'sug ' + sg.kind; box.innerHTML = `<div><div class="lbl">Next session</div>${sg.text}</div>`; }
  toast('Saved');
});
view.addEventListener('focusin', e => { if (e.target.matches('.set input')) setTimeout(() => { try { e.target.select(); } catch (_) { } }, 0); });
view.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.matches('.set input')) return;
  e.preventDefault();
  if (e.target.classList.contains('w')) $('input.r', e.target.closest('.set')).focus(); else e.target.blur();
});
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (tab === 'settings') render(); });
addEventListener('storage', e => { if (e.key === KEY) { S = load(); render(); } });

if ('serviceWorker' in navigator && location.protocol !== 'file:') addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { }));
render(); tick(); syncWake();
</script>
