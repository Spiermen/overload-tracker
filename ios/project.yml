# Optional: on a Mac, `brew install xcodegen && cd ios && xcodegen` can regenerate
# the Xcode project to include the widget. The Capacitor-generated project is the
# source of truth for day-to-day; see native/WIDGET_SETUP.md for the one-time
# Xcode steps (also needed for App Groups + HealthKit capabilities).
name: App
options:
  bundleIdPrefix: com.spiermen
  deploymentTarget:
    iOS: "15.0"
settings:
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"
targets:
  App:
    type: application
    platform: iOS
    sources: [App/App]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.spiermen.dadstrong
      INFOPLIST_FILE: App/App/Info.plist
      CODE_SIGN_ENTITLEMENTS: App/App/App.entitlements
    entitlements:
      path: App/App/App.entitlements
    dependencies:
      - target: DadStrongWidget
  DadStrongWidget:
    type: app-extension
    platform: iOS
    sources: [App/DadStrongWidget]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.spiermen.dadstrong.widget
      INFOPLIST_FILE: App/DadStrongWidget/Info.plist
      CODE_SIGN_ENTITLEMENTS: App/DadStrongWidget/DadStrongWidget.entitlements
    entitlements:
      path: App/DadStrongWidget/DadStrongWidget.entitlements
