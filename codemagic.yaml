# Alternative to GitHub Actions — connect this repo in Codemagic and set the same secrets.
workflows:
  dadstrong-ios:
    name: DadStrong iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.spiermen.dadstrong"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install & sync
        script: |
          npm ci
          npm run sync:www
          npx cap sync ios
          cd ios/App && pod install
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $ASC_KEY_P8
        key_id: $ASC_KEY_ID
        issuer_id: $ASC_ISSUER_ID
        submit_to_testflight: true
